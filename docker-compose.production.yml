version: '3.8'

services:
  # --- Reverse Proxy (Edge Router) ---
  nginx:
    image: nginx:alpine
    container_name: enterprise-rag-nginx
    ports:
      - "80:80"
      # - "443:443" # Uncomment if TLS certificates are mounted
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - public_net

  # --- Frontend Application ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise-rag-frontend
    # Expose internally to nginx, not published to host
    expose:
      - "3000"
    environment:
      # Relative API URL — nginx strips /api prefix before forwarding to backend
      - NEXT_PUBLIC_API_URL=/api
    restart: unless-stopped
    networks:
      - public_net

  # --- Backend API ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-rag-backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      # Override with production-specific values
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - data_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - public_net
      - internal_net

  # --- Background Worker (ARQ) ---
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise-rag-worker
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - .env
    volumes:
      - data_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal_net

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-rag-postgres
    # DO NOT EXPOSE TO HOST IN PRODUCTION
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal_net

  # --- Qdrant Vector Database ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise-rag-qdrant
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal_net

  # --- Redis (Message Broker / Rate Limiting) ---
  redis:
    image: redis:7-alpine
    container_name: enterprise-rag-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal_net

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true # No external internet access for databases

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  data_uploads:
