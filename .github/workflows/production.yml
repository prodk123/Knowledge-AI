name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint, Test, and Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest bandit safety
        
    - name: Security Scan (Bandit)
      run: |
        cd backend
        bandit -r app/
        
    - name: Dependency Vulnerability Scan (Safety)
      run: |
        cd backend
        safety check -r requirements.txt || echo "Warning: vulnerabilities found"
        
    - name: Run Tests (Unit & Integration)
      run: |
        cd backend
        # We assume tests don't require external secrets here or use mock providers
        pytest tests/
        
  build-and-push:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false # Set to true to push to registry
        tags: enterprise-rag-backend:latest
        
    - name: Build Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        tags: enterprise-rag-frontend:latest
